name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LOG_LEVEL: None
  UNITY_VERSION: 6000.4.12f1
  UNITY_IMAGE_VERSION: 3

jobs:
  resolve-media:
    name: Resolve media revision
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
      sha: ${{ steps.resolve.outputs.sha }}

    steps:
      - name: Checkout media metadata
        uses: actions/checkout@v4
        with:
          repository: adasgames/rebellion2-media
          ref: main
          ssh-key: ${{ secrets.REBELLION2_MEDIA_SSH_KEY }}
          lfs: false
          path: .ci/rebellion2-media

      - name: Resolve matching media branch
        id: resolve
        env:
          PULL_REQUEST_BRANCH: ${{ github.head_ref }}
        run: |
          revision="main"
          if [ -n "$PULL_REQUEST_BRANCH" ]; then
            for candidate in "$PULL_REQUEST_BRANCH" "$PULL_REQUEST_BRANCH-media"; do
              if git -C .ci/rebellion2-media ls-remote --exit-code --heads origin \
                "refs/heads/$candidate" >/dev/null; then
                revision="$candidate"
                break
              fi
            done
          fi
          sha="$(git -C .ci/rebellion2-media ls-remote origin "refs/heads/$revision" | awk 'NR == 1 { print $1 }')"
          if [ -z "$sha" ]; then
            echo "Could not resolve rebellion2-media revision: $revision"
            exit 1
          fi
          echo "Using rebellion2-media revision: $revision"
          echo "Using rebellion2-media commit: $sha"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.targetPlatform }})
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: resolve-media
    environment: production
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [StandaloneWindows64, StandaloneLinux64, StandaloneOSX]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout media (git only, no LFS)
        uses: actions/checkout@v4
        with:
          repository: adasgames/rebellion2-media
          ref: ${{ needs.resolve-media.outputs.sha }}
          ssh-key: ${{ secrets.REBELLION2_MEDIA_SSH_KEY }}
          lfs: false
          path: .ci/rebellion2-media

      - name: Pull media LFS and Unity image
        working-directory: .ci/rebellion2-media
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          case "${{ matrix.targetPlatform }}" in
            StandaloneLinux64)   MODULE="linux-il2cpp" ;;
            StandaloneWindows64) MODULE="windows-mono" ;;
            StandaloneOSX)       MODULE="mac-mono" ;;
          esac
          IMAGE="unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-${MODULE}-${{ env.UNITY_IMAGE_VERSION }}"
          (
            for attempt in 1 2 3; do
              docker pull "$IMAGE" && exit 0
              echo "Attempt $attempt failed, retrying in 30s..."
              sleep 30
            done
            exit 1
          ) > "$RUNNER_TEMP/unity-image-pull.log" 2>&1 &
          pull_pid=$!
          trap 'kill "$pull_pid" >/dev/null 2>&1 || true' EXIT

          HOST="${R2_ENDPOINT#https://}"
          git config lfs.url "https://${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}@rebellion2-lfs-proxy.pages.dev/${HOST}/${R2_BUCKET}"
          git config lfs.concurrenttransfers 3
          git config lfs.transfer.batchSize 20
          for attempt in 1 2 3 4; do
            if git lfs pull \
              --include="Content/**,Models/MainMenu/**,UnityAssets/**" \
              --exclude="Content/**/*.mp4"; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              echo "Media LFS download failed after $attempt attempts."
              exit 1
            fi
            delay=$((attempt * 20))
            echo "Media LFS download attempt $attempt failed; retrying in ${delay}s..."
            sleep "$delay"
          done
          find Content -type f -name '*.mp4' -exec sh -c ': > "$1"' _ {} \;
          if grep -RIl '^version https://git-lfs.github.com/spec/v1$' Content Models/MainMenu UnityAssets; then
            echo "Media checkout still contains Git LFS pointers."
            exit 1
          fi

          if ! wait "$pull_pid"; then
            cat "$RUNNER_TEMP/unity-image-pull.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/unity-image-pull.log"
          trap - EXIT

      - name: Install media
        run: |
          mkdir -p Assets/Content Assets/Art/Models/MainMenu
          test -f .ci/rebellion2-media/Content/Application/Schemas/game-config.xsd
          rsync -a --delete --exclude=.DS_Store --exclude='*.meta' .ci/rebellion2-media/Content/ Assets/Content/
          rsync -a --delete --exclude=.DS_Store --exclude='*.meta' .ci/rebellion2-media/Models/MainMenu/ Assets/Art/Models/MainMenu/
          rsync -a --exclude=.DS_Store .ci/rebellion2-media/UnityAssets/ Assets/
          rm -rf .ci

      - name: Build project
        id: unity-build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: StandalonePlayerBuild.Build
          buildName: rebellion2
          buildsPath: build

      - name: Package verified desktop bundle
        shell: bash
        run: |
          extension="tar.gz"
          if [ "${{ matrix.targetPlatform }}" = "StandaloneWindows64" ]; then
            extension="zip"
          fi
          python3 Tools/package_desktop.py \
            --platform "${{ matrix.targetPlatform }}" \
            --build-dir "build/${{ matrix.targetPlatform }}" \
            --output "dist/rebellion2-${{ matrix.targetPlatform }}.$extension"

      - name: Reset package files
        run: |
          git checkout -- Packages/manifest.json Packages/packages-lock.json 2>/dev/null || true
          sudo rm -rf artifacts || true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          dotnet tool restore

      - name: Format check
        run: dotnet csharpier check Assets/

      - name: Test desktop packaging
        run: python3 -m unittest discover -s Tools/tests -v

      - name: Extract Unity managed assemblies
        run: |
          IMAGE="unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-linux-il2cpp-${{ env.UNITY_IMAGE_VERSION }}"
          for attempt in 1 2 3; do
            docker pull "$IMAGE" && break
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 30s..."
            sleep 30
          done

          CONTAINER_ID="$(docker create "$IMAGE")"
          trap 'docker rm "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT
          mkdir -p .unity-lint-assemblies

          docker cp "$CONTAINER_ID:/opt/unity/Editor/Data/Managed/UnityEngine/." .unity-lint-assemblies/ 2>/dev/null || true
          if docker cp "$CONTAINER_ID:/opt/unity/Editor/Data/Managed/UnityEditor/." .unity-lint-assemblies/ 2>/dev/null; then
            echo "Copied UnityEditor assemblies from Managed/UnityEditor"
          elif docker cp "$CONTAINER_ID:/opt/unity/Editor/Data/Managed/." .unity-lint-assemblies/ 2>/dev/null; then
            echo "Copied Unity managed assemblies from Managed"
          else
            echo "ERROR: Could not locate Unity managed assemblies in $IMAGE"
            exit 1
          fi

          find .unity-lint-assemblies/UnityEngine .unity-lint-assemblies/UnityEditor -maxdepth 1 -name "*.dll" -exec cp {} .unity-lint-assemblies/ \; 2>/dev/null || true

          # Stage package assemblies. These are not in Data/Managed; they are
          # precompiled in the editor image's project-template library cache. Resolving them keeps the
          # lint semantic model complete so IDE0005 does not falsely flag genuinely-used usings.
          docker cp "$CONTAINER_ID:/opt/unity/Editor/Data/Resources/PackageManager/ProjectTemplates/libcache/." /tmp/unity-libcache/ 2>/dev/null || true
          for dll in UnityEngine.UI.dll Unity.TextMeshPro.dll Unity.TextMeshPro.Editor.dll Unity.InputSystem.dll Unity.Burst.dll Unity.Collections.dll Unity.InternalAPIEngineBridge.004.dll Unity.InternalAPIEngineBridge.RenderPipelines.Core.Runtime.Shared.dll Unity.Mathematics.dll Unity.RenderPipelines.Core.Runtime.dll Unity.RenderPipelines.Core.Runtime.Shared.dll Unity.RenderPipelines.GPUDriven.Runtime.dll Unity.RenderPipelines.HighDefinition.Config.Runtime.dll Unity.RenderPipelines.HighDefinition.Runtime.dll Unity.Timeline.dll Unity.VisualEffectGraph.Runtime.dll; do
            src="$(find /tmp/unity-libcache -name "$dll" 2>/dev/null | head -n 1)"
            if [ -n "$src" ]; then
              cp "$src" .unity-lint-assemblies/
            fi
          done
          rm -rf /tmp/unity-libcache

          for assembly in UnityEngine.CoreModule.dll UnityEditor.dll UnityEngine.UI.dll Unity.TextMeshPro.dll Unity.InputSystem.dll Unity.Burst.dll Unity.Collections.dll Unity.InternalAPIEngineBridge.004.dll Unity.InternalAPIEngineBridge.RenderPipelines.Core.Runtime.Shared.dll Unity.Mathematics.dll Unity.RenderPipelines.Core.Runtime.dll Unity.RenderPipelines.Core.Runtime.Shared.dll Unity.RenderPipelines.GPUDriven.Runtime.dll Unity.RenderPipelines.HighDefinition.Config.Runtime.dll Unity.RenderPipelines.HighDefinition.Runtime.dll Unity.Timeline.dll Unity.VisualEffectGraph.Runtime.dll UnityEngine.ImageConversionModule.dll UnityEngine.UnityWebRequestModule.dll UnityEngine.UnityWebRequestAudioModule.dll; do
            if [ ! -f ".unity-lint-assemblies/$assembly" ]; then
              echo "ERROR: Missing required Unity lint assembly: $assembly"
              exit 1
            fi
          done

          docker rm "$CONTAINER_ID"
          trap - EXIT

      - name: Lint
        run: UnityManagedAssembliesPath="$PWD/.unity-lint-assemblies" bash build.sh lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: resolve-media
    environment: production
    permissions:
      checks: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout media (git only, no LFS)
        uses: actions/checkout@v4
        with:
          repository: adasgames/rebellion2-media
          ref: ${{ needs.resolve-media.outputs.sha }}
          ssh-key: ${{ secrets.REBELLION2_MEDIA_SSH_KEY }}
          lfs: false
          path: .ci/rebellion2-media

      - name: Select public Unity package cache paths
        id: unity-package-paths
        run: |
          python3 - <<'EOF'
          import json
          import os
          import re
          from pathlib import Path

          packages = json.loads(Path("Packages/packages-lock.json").read_text())["dependencies"]
          paths = [
              "Library/PackageCache/" + name + "@*"
              for name, package in packages.items()
              if re.fullmatch(r"com\.unity\.[a-z0-9_.-]+", name)
              and package.get("source") == "registry"
              and package.get("url") == "https://packages.unity.com"
          ]
          if not paths:
              raise SystemExit("No public Unity registry packages were selected.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("paths<<PUBLIC_UNITY_PACKAGES\n" + "\n".join(sorted(paths)) + "\nPUBLIC_UNITY_PACKAGES\n")
          EOF

      - name: Cache public Unity packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.unity-package-paths.outputs.paths }}
          key: unity-packages-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}

      - name: Restore Unity tooling image
        id: unity-image-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/unity-tooling-image.tar.zst
          key: unity-tooling-${{ runner.os }}-${{ runner.arch }}-${{ env.UNITY_VERSION }}-${{ env.UNITY_IMAGE_VERSION }}-${{ hashFiles('.github/docker/unity-tests.Dockerfile') }}

      - name: Pull media LFS and Unity image
        working-directory: .ci/rebellion2-media
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        shell: bash
        run: |
          BASE_IMAGE="unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-linux-il2cpp-${{ env.UNITY_IMAGE_VERSION }}"
          (
            if [ "${{ steps.unity-image-cache.outputs.cache-hit }}" = "true" ]; then
              zstd --decompress --stdout "$RUNNER_TEMP/unity-tooling-image.tar.zst" | docker load
              exit 0
            fi
            for attempt in 1 2 3; do
              docker pull "$BASE_IMAGE" && exit 0
              echo "Attempt $attempt failed, retrying in 30s..."
              sleep 30
            done
            exit 1
          ) > "$RUNNER_TEMP/unity-image-pull.log" 2>&1 &
          pull_pid=$!
          trap 'kill "$pull_pid" >/dev/null 2>&1 || true' EXIT

          HOST="${R2_ENDPOINT#https://}"
          git config lfs.url "https://${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}@rebellion2-lfs-proxy.pages.dev/${HOST}/${R2_BUCKET}"
          git config lfs.concurrenttransfers 3
          git config lfs.transfer.batchSize 20
          for attempt in 1 2 3 4; do
            if git lfs pull \
              --include="Content/**,Models/MainMenu/**,UnityAssets/**" \
              --exclude="Content/**/*.mp4"; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              echo "Media LFS download failed after $attempt attempts."
              exit 1
            fi
            delay=$((attempt * 20))
            echo "Media LFS download attempt $attempt failed; retrying in ${delay}s..."
            sleep "$delay"
          done
          find Content -type f -name '*.mp4' -exec sh -c ': > "$1"' _ {} \;
          if grep -RIl '^version https://git-lfs.github.com/spec/v1$' Content Models/MainMenu UnityAssets; then
            echo "Media checkout still contains Git LFS pointers."
            exit 1
          fi

          if ! wait "$pull_pid"; then
            cat "$RUNNER_TEMP/unity-image-pull.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/unity-image-pull.log"
          trap - EXIT

      - name: Install media
        run: |
          mkdir -p Assets/Content Assets/Art/Models/MainMenu
          test -f .ci/rebellion2-media/Content/Application/Schemas/game-config.xsd
          rsync -a --delete --exclude=.DS_Store --exclude='*.meta' .ci/rebellion2-media/Content/ Assets/Content/
          rsync -a --delete --exclude=.DS_Store --exclude='*.meta' .ci/rebellion2-media/Models/MainMenu/ Assets/Art/Models/MainMenu/
          rsync -a --exclude=.DS_Store .ci/rebellion2-media/UnityAssets/ Assets/
          rm -rf .ci

      - name: Prepare Vulkan-enabled Unity test image
        if: steps.unity-image-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          BASE_IMAGE="unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-linux-il2cpp-${{ env.UNITY_IMAGE_VERSION }}"
          docker build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --tag rebellion2-unity-test:vulkan \
            --file .github/docker/unity-tests.Dockerfile \
            .github/docker
          docker save rebellion2-unity-test:vulkan \
            | zstd --threads=0 -3 -o "$RUNNER_TEMP/unity-tooling-image.tar.zst"

      - name: Cache Unity tooling image
        if: steps.unity-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/unity-tooling-image.tar.zst
          key: ${{ steps.unity-image-cache.outputs.cache-primary-key }}

      - name: Run Unity Tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          dockerMemoryLimit: 8g
          customImage: rebellion2-unity-test:vulkan
          customParameters: -force-vulkan -debugCodeOptimization -executeMethod UIBuilderMenu.BuildAll
          coverageEnabled: true
          coverageOptions: "generateHtmlReport;assemblyFilters:+GameAssembly"
          checkName: Test results
          cliVersion: v0.1.65

      - name: Summarize test execution time
        if: ${{ !cancelled() && hashFiles('artifacts/editmode-results.xml') != '' }}
        env:
          TEST_RUN_NAME: Test
        run: |
          python3 - <<'EOF'
          import os
          import xml.etree.ElementTree as ET
          from datetime import datetime
          from pathlib import Path

          root = ET.parse("artifacts/editmode-results.xml").getroot()
          cases = [case for case in root.iter("test-case")
                   if "start-time" in case.attrib and "end-time" in case.attrib]
          first = min(datetime.fromisoformat(case.attrib["start-time"]) for case in cases)
          last = max(datetime.fromisoformat(case.attrib["end-time"]) for case in cases)
          seconds = (last - first).total_seconds()
          summary = (
              f"### {os.environ['TEST_RUN_NAME']} execution\n\n"
              f"{root.attrib['passed']}/{root.attrib['total']} passed; "
              f"{root.attrib['failed']} failed; {root.attrib['skipped']} skipped.\n\n"
              f"First test start to final test end: **{seconds:.1f}s**. "
              "This includes transitions between tests and excludes initial Unity setup.\n"
          )
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          EOF

      - name: Upload Unity test results
        if: ${{ !cancelled() && hashFiles('artifacts/editmode-results.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: editmode-test-results
          path: artifacts/editmode-results.xml
          retention-days: 7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check compiled architecture
        run: |
          set -euo pipefail
          test -f Library/ScriptAssemblies/GameAssembly.dll
          test -f Library/ScriptAssemblies/ContentPackEditorAssembly.dll
          architecture_runtime="$RUNNER_TEMP/architecture-unity-runtime"
          mkdir -p "$architecture_runtime"
          architecture_container="$(docker create rebellion2-unity-test:vulkan)"
          trap 'docker rm "$architecture_container" >/dev/null' EXIT
          docker cp "$architecture_container:/opt/unity/Editor/Data/Managed/UnityEngine/." "$architecture_runtime/"
          dotnet build Tools/Rebellion.Architecture.Tests/Rebellion.Architecture.Tests.csproj \
            -p:UnityCompiledAssembliesPath="$PWD/Library/ScriptAssemblies"
          architecture_output="Tools/Rebellion.Architecture.Tests/bin/Debug/net8.0"
          cp "$architecture_runtime"/*.dll "$architecture_output/"
          for package in Library/ScriptAssemblies/Unity*.dll Library/ScriptAssemblies/glTFast*.dll; do
            if [ -f "$package" ]; then
              cp "$package" "$architecture_output/"
            fi
          done
          dotnet test Tools/Rebellion.Architecture.Tests/Rebellion.Architecture.Tests.csproj \
            --no-build --logger "console;verbosity=normal"

      - name: Check coverage threshold
        run: |
          python3 - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          LINE_THRESHOLD   = 79.0
          METHOD_THRESHOLD = 87.8

          summary_path = Path("CodeCoverage/Report/Summary.xml")
          if not summary_path.is_file():
              print("FAIL: CodeCoverage/Report/Summary.xml was not generated")
              sys.exit(1)

          root = ET.parse(summary_path).getroot()
          summary = root.find("Summary")

          covered_lines = int(summary.findtext("Coveredlines", 0))
          total_lines   = int(summary.findtext("Totallines", 0))
          line_pct      = float(summary.findtext("Linecoverage", 0))

          covered_methods = int(summary.findtext("Coveredmethods", 0))
          total_methods   = int(summary.findtext("Totalmethods", 0))
          method_pct      = float(summary.findtext("Methodcoverage", 0))

          print(f"Line coverage:   {line_pct:.1f}% ({covered_lines}/{total_lines})")
          print(f"Method coverage: {method_pct:.1f}% ({covered_methods}/{total_methods})")

          failed = False
          if line_pct < LINE_THRESHOLD:
              print(f"FAIL: line coverage {line_pct:.1f}% is below threshold {LINE_THRESHOLD}%")
              failed = True
          if method_pct < METHOD_THRESHOLD:
              print(f"FAIL: method coverage {method_pct:.1f}% is below threshold {METHOD_THRESHOLD}%")
              failed = True

          if failed:
              sys.exit(1)

          print("OK: all coverage thresholds met")
          EOF
