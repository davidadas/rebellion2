name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to test
        required: true
        type: string
      head_sha:
        description: Exact PR head commit to review and test
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.pull_request_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LOG_LEVEL: None
  UNITY_VERSION: 6000.4.12f1
  UNITY_IMAGE_VERSION: 3

jobs:
  resolve-media:
    name: Resolve media revision
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/resolve-media.yml
    with:
      branch: ${{ github.head_ref }}
    secrets: inherit
    permissions:
      contents: read

  build:
    name: Build (${{ matrix.targetPlatform }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.targetPlatform == 'StandaloneWindows64' && 'windows-2022' || 'ubuntu-latest' }}
    needs: resolve-media
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [StandaloneWindows64, StandaloneLinux64, StandaloneOSX]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout media (git only, no LFS)
        uses: actions/checkout@v4
        with:
          repository: adasgames/rebellion2-media
          ref: ${{ needs.resolve-media.outputs.sha }}
          ssh-key: ${{ secrets.REBELLION2_MEDIA_SSH_KEY }}
          lfs: false
          path: .ci/rebellion2-media

      - name: Pull media LFS and Unity image
        working-directory: .ci/rebellion2-media
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          pull_pid=""
          if [ "$RUNNER_OS" = "Linux" ]; then
            case "${{ matrix.targetPlatform }}" in
              StandaloneLinux64) MODULE="linux-il2cpp" ;;
              StandaloneOSX)     MODULE="mac-mono" ;;
            esac
            IMAGE="unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-${MODULE}-${{ env.UNITY_IMAGE_VERSION }}"
            (
              for attempt in 1 2 3; do
                docker pull "$IMAGE" && exit 0
                echo "Attempt $attempt failed, retrying in 30s..."
                sleep 30
              done
              exit 1
            ) > "$RUNNER_TEMP/unity-image-pull.log" 2>&1 &
            pull_pid=$!
            trap 'kill "$pull_pid" >/dev/null 2>&1 || true' EXIT
          fi

          HOST="${R2_ENDPOINT#https://}"
          git config lfs.url "https://${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}@rebellion2-lfs-proxy.pages.dev/${HOST}/${R2_BUCKET}"
          git config lfs.concurrenttransfers 3
          git config lfs.transfer.batchSize 20
          for attempt in 1 2 3 4; do
            if git lfs pull \
              --include="Content/**,Models/MainMenu/**,UnityAssets/**" \
              --exclude="Content/**/*.mp4"; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              echo "Media LFS download failed after $attempt attempts."
              exit 1
            fi
            delay=$((attempt * 20))
            echo "Media LFS download attempt $attempt failed; retrying in ${delay}s..."
            sleep "$delay"
          done
          find Content -type f -name '*.mp4' -exec sh -c ': > "$1"' _ {} \;
          if grep -RIl '^version https://git-lfs.github.com/spec/v1$' Content Models/MainMenu UnityAssets; then
            echo "Media checkout still contains Git LFS pointers."
            exit 1
          fi

          if [ -n "$pull_pid" ]; then
            if ! wait "$pull_pid"; then
              cat "$RUNNER_TEMP/unity-image-pull.log"
              exit 1
            fi
            cat "$RUNNER_TEMP/unity-image-pull.log"
            trap - EXIT
          fi

      - name: Install media
        run: |
          python Tools/install_build_media.py .ci/rebellion2-media Assets
          rm -rf .ci

      - name: Install multiplayer build configuration
        env:
          EOS_BUILD_CONFIG: ${{ secrets.EOS_BUILD_CONFIG }}
        run: |
          if [ -z "$EOS_BUILD_CONFIG" ]; then
            echo "EOS_BUILD_CONFIG must contain the multiplayer deployment configuration."
            exit 1
          fi
          mkdir -p Assets/StreamingAssets/EOS
          for name in eos_product_config.json eos_windows_config.json eos_linux_config.json eos_macos_config.json player_auth_config.json; do
            if ! printf '%s' "$EOS_BUILD_CONFIG" | jq -e --arg name "$name" '.[$name] | select(type == "object")' > "Assets/StreamingAssets/EOS/$name" 2>/dev/null; then
              echo "EOS_BUILD_CONFIG is missing a valid $name object."
              exit 1
            fi
          done

      - name: Build project
        id: unity-build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: StandalonePlayerBuild.Build
          buildName: rebellion2
          buildsPath: build

      - name: Package verified desktop bundle
        shell: bash
        run: |
          extension="tar.gz"
          if [ "${{ matrix.targetPlatform }}" = "StandaloneWindows64" ]; then
            extension="zip"
          fi
          python Tools/package_desktop.py \
            --platform "${{ matrix.targetPlatform }}" \
            --build-dir "build/${{ matrix.targetPlatform }}" \
            --output "dist/rebellion2-${{ matrix.targetPlatform }}.$extension"

      - name: Reset package files
        run: |
          git checkout -- Packages/manifest.json Packages/packages-lock.json 2>/dev/null || true
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo rm -rf artifacts || true
          else
            rm -rf artifacts || true
          fi

  windows-build-tools:
    if: github.event_name != 'workflow_dispatch'
    name: Test Windows media staging
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test media staging
        run: python -m unittest discover -s Tools/tests -p test_install_build_media.py

  lint:
    name: Lint
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate workflow definitions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color -shellcheck=

      - name: Test PR workflow helpers
        run: |
          npm ci --prefix .github/scripts --ignore-scripts
          npm test --prefix .github/scripts

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          dotnet tool restore

      - name: Format check
        run: dotnet csharpier check Assets/

      - name: Test desktop packaging
        run: python3 -m unittest discover -s Tools/tests -v

      - name: Extract Unity managed assemblies
        run: |
          IMAGE="unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-linux-il2cpp-${{ env.UNITY_IMAGE_VERSION }}"
          for attempt in 1 2 3; do
            docker pull "$IMAGE" && break
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 30s..."
            sleep 30
          done

          CONTAINER_ID="$(docker create "$IMAGE")"
          trap 'docker rm "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT
          mkdir -p .unity-lint-assemblies

          for dll in Unity.CompilationPipeline.Common.dll Unity.Cecil.dll; do
            docker cp "$CONTAINER_ID:/opt/unity/Editor/Data/Managed/$dll" ".unity-lint-assemblies/$dll"
          done

          docker cp "$CONTAINER_ID:/opt/unity/Editor/Data/Managed/UnityEngine/." .unity-lint-assemblies/ 2>/dev/null || true
          if docker cp "$CONTAINER_ID:/opt/unity/Editor/Data/Managed/UnityEditor/." .unity-lint-assemblies/ 2>/dev/null; then
            echo "Copied UnityEditor assemblies from Managed/UnityEditor"
          elif docker cp "$CONTAINER_ID:/opt/unity/Editor/Data/Managed/." .unity-lint-assemblies/ 2>/dev/null; then
            echo "Copied Unity managed assemblies from Managed"
          else
            echo "ERROR: Could not locate Unity managed assemblies in $IMAGE"
            exit 1
          fi

          find .unity-lint-assemblies/UnityEngine .unity-lint-assemblies/UnityEditor -maxdepth 1 -name "*.dll" -exec cp {} .unity-lint-assemblies/ \; 2>/dev/null || true

          # Stage package assemblies. These are not in Data/Managed; they are
          # precompiled in the editor image's project-template library cache. Resolving them keeps the
          # lint semantic model complete so IDE0005 does not falsely flag genuinely-used usings.
          docker cp "$CONTAINER_ID:/opt/unity/Editor/Data/Resources/PackageManager/ProjectTemplates/libcache/." /tmp/unity-libcache/ 2>/dev/null || true
          for dll in Newtonsoft.Json.dll UnityEngine.UI.dll Unity.TextMeshPro.dll Unity.TextMeshPro.Editor.dll Unity.InputSystem.dll Unity.Burst.dll Unity.Collections.dll Unity.InternalAPIEngineBridge.004.dll Unity.InternalAPIEngineBridge.RenderPipelines.Core.Runtime.Shared.dll Unity.Mathematics.dll Unity.RenderPipelines.Core.Runtime.dll Unity.RenderPipelines.Core.Runtime.Shared.dll Unity.RenderPipelines.GPUDriven.Runtime.dll Unity.RenderPipelines.HighDefinition.Config.Runtime.dll Unity.RenderPipelines.HighDefinition.Runtime.dll Unity.Timeline.dll Unity.VisualEffectGraph.Runtime.dll; do
            src="$(find /tmp/unity-libcache -name "$dll" 2>/dev/null | head -n 1)"
            if [ -n "$src" ]; then
              cp "$src" .unity-lint-assemblies/
            fi
          done
          rm -rf /tmp/unity-libcache

          for assembly in Newtonsoft.Json.dll UnityEngine.CoreModule.dll UnityEditor.dll UnityEngine.UI.dll Unity.TextMeshPro.dll Unity.InputSystem.dll Unity.Burst.dll Unity.Collections.dll Unity.InternalAPIEngineBridge.004.dll Unity.InternalAPIEngineBridge.RenderPipelines.Core.Runtime.Shared.dll Unity.Mathematics.dll Unity.RenderPipelines.Core.Runtime.dll Unity.RenderPipelines.Core.Runtime.Shared.dll Unity.RenderPipelines.GPUDriven.Runtime.dll Unity.RenderPipelines.HighDefinition.Config.Runtime.dll Unity.RenderPipelines.HighDefinition.Runtime.dll Unity.Timeline.dll Unity.VisualEffectGraph.Runtime.dll UnityEngine.ImageConversionModule.dll UnityEngine.UnityWebRequestModule.dll UnityEngine.UnityWebRequestAudioModule.dll; do
            if [ ! -f ".unity-lint-assemblies/$assembly" ]; then
              echo "ERROR: Missing required Unity lint assembly: $assembly"
              exit 1
            fi
          done

          docker rm "$CONTAINER_ID"
          trap - EXIT

      - name: Lint
        run: UnityManagedAssembliesPath="$PWD/.unity-lint-assemblies" bash build.sh lint

  test:
    name: Test
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: resolve-media
    uses: ./.github/workflows/unity-test-runner.yml
    with:
      checkout_ref: ${{ github.sha }}
      media_sha: ${{ needs.resolve-media.outputs.sha }}
    secrets: inherit
    permissions:
      checks: write
      contents: read
      pull-requests: write

  pr-plan:
    name: Prepare PR test review
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
    outputs:
      check_id: ${{ steps.plan.outputs.check_id }}
      review_url: ${{ steps.plan.outputs.review_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: plan
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
          PR_HEAD_SHA: ${{ inputs.head_sha }}
        with:
          script: |
            const { plan } = require('./.github/scripts/pr-tests.cjs');
            await plan({ github, context, core,
              number: process.env.PR_NUMBER, headSha: process.env.PR_HEAD_SHA });

  approve-pr:
    name: Review private test access
    needs: pr-plan
    runs-on: ubuntu-latest
    environment:
      name: Fork PR tests
      url: ${{ needs.pr-plan.outputs.review_url }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      merge_sha: ${{ steps.approve.outputs.merge_sha }}
      media_branch: ${{ steps.approve.outputs.media_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: approve
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
          PR_HEAD_SHA: ${{ inputs.head_sha }}
        with:
          script: |
            const { approve } = require('./.github/scripts/pr-tests.cjs');
            await approve({ github, context, core,
              number: process.env.PR_NUMBER, headSha: process.env.PR_HEAD_SHA });

  resolve-pr-media:
    name: Resolve approved PR media
    needs: approve-pr
    uses: ./.github/workflows/resolve-media.yml
    with:
      branch: ${{ needs.approve-pr.outputs.media_branch }}
    secrets: inherit
    permissions:
      contents: read

  test-pr:
    name: Test reviewed PR
    needs: [approve-pr, resolve-pr-media]
    uses: ./.github/workflows/unity-test-runner.yml
    with:
      checkout_ref: ${{ needs.approve-pr.outputs.merge_sha }}
      reviewed_head_sha: ${{ inputs.head_sha }}
      media_sha: ${{ needs.resolve-pr-media.outputs.sha }}
      publish_checks: false
      save_cache: false
    secrets: inherit
    permissions:
      contents: read

  pr-result:
    name: Report reviewed PR tests
    if: always() && github.event_name == 'workflow_dispatch' && needs.pr-plan.outputs.check_id != ''
    needs: [pr-plan, approve-pr, resolve-pr-media, test-pr]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ needs.pr-plan.outputs.check_id }}
          TEST_RESULT: ${{ needs.test-pr.result }}
          MEDIA_RESULT: ${{ needs.resolve-pr-media.result }}
          APPROVAL_RESULT: ${{ needs.approve-pr.result }}
        with:
          script: |
            const { report } = require('./.github/scripts/pr-tests.cjs');
            await report({ github, context, checkId: process.env.CHECK_ID,
              testResult: process.env.TEST_RESULT, mediaResult: process.env.MEDIA_RESULT,
              approvalResult: process.env.APPROVAL_RESULT });
