name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.4.0f1
  UNITY_IMAGE_VERSION: 3

jobs:
  resolve-media:
    name: Resolve media revision
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}

    steps:
      - name: Checkout media metadata
        uses: actions/checkout@v4
        with:
          repository: davidadas/rebellion2-media
          ref: main
          ssh-key: ${{ secrets.REBELLION2_MEDIA_SSH_KEY }}
          lfs: false
          path: .ci/rebellion2-media

      - name: Resolve matching media branch
        id: resolve
        env:
          PULL_REQUEST_BRANCH: ${{ github.head_ref }}
        run: |
          revision="main"
          if [ -n "$PULL_REQUEST_BRANCH" ] && git -C .ci/rebellion2-media \
            ls-remote --exit-code --heads origin \
            "refs/heads/$PULL_REQUEST_BRANCH" >/dev/null; then
            revision="$PULL_REQUEST_BRANCH"
          fi
          echo "Using rebellion2-media revision: $revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.targetPlatform }})
    runs-on: ubuntu-latest
    needs: [lint, resolve-media]
    environment: production
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        targetPlatform: ${{ fromJSON(github.event_name == 'pull_request' && '["StandaloneLinux64"]' || '["StandaloneWindows64", "StandaloneLinux64", "StandaloneOSX"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout media (git only, no LFS)
        uses: actions/checkout@v4
        with:
          repository: davidadas/rebellion2-media
          ref: ${{ needs.resolve-media.outputs.revision }}
          ssh-key: ${{ secrets.REBELLION2_MEDIA_SSH_KEY }}
          lfs: false
          path: .ci/rebellion2-media

      - name: Pull media LFS from R2
        working-directory: .ci/rebellion2-media
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          HOST="${R2_ENDPOINT#https://}"
          git config lfs.url "https://${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}@rebellion2-lfs-proxy.pages.dev/${HOST}/${R2_BUCKET}"
          git config lfs.concurrenttransfers 3
          git config lfs.transfer.batchSize 20
          for attempt in 1 2 3 4; do
            if git lfs pull --include="Content/**,Models/MainMenu/**" --exclude=""; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              echo "Media LFS download failed after $attempt attempts."
              exit 1
            fi
            delay=$((attempt * 20))
            echo "Media LFS download attempt $attempt failed; retrying in ${delay}s..."
            sleep "$delay"
          done
          if grep -RIl '^version https://git-lfs.github.com/spec/v1$' Content Models/MainMenu; then
            echo "Media checkout still contains Git LFS pointers."
            exit 1
          fi

      - name: Install media
        run: |
          mkdir -p Assets/Content Assets/Art/Models/MainMenu Assets/Resources/UI
          test -f .ci/rebellion2-media/Content/Application/Schemas/game-config.xsd
          rsync -a --delete --exclude=.DS_Store --exclude='*.meta' .ci/rebellion2-media/Content/ Assets/Content/
          rsync -a --delete --exclude=.DS_Store --exclude='*.meta' .ci/rebellion2-media/Models/MainMenu/ Assets/Art/Models/MainMenu/
          cp .ci/rebellion2-media/Content/Application/Common/UI/ui_common_cursor_default_outlined.png Assets/Resources/UI/DefaultCursor.png
          rm -rf .ci

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Pre-pull Unity Docker image
        run: |
          case "${{ matrix.targetPlatform }}" in
            StandaloneLinux64)   MODULE="linux-il2cpp" ;;
            StandaloneWindows64) MODULE="windows-mono" ;;
            StandaloneOSX)       MODULE="mac-mono" ;;
          esac
          IMAGE="unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-${MODULE}-${{ env.UNITY_IMAGE_VERSION }}"
          for attempt in 1 2 3; do
            docker pull "$IMAGE" && exit 0
            echo "Attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: StandalonePlayerBuild.Build

      - name: Reset package files
        run: |
          git checkout -- Packages/manifest.json Packages/packages-lock.json 2>/dev/null || true
          sudo rm -rf artifacts || true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Install tools
        run: |
          dotnet tool restore

      - name: Format check
        run: dotnet csharpier check Assets/

      - name: Extract Unity managed assemblies
        run: |
          IMAGE="unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-linux-il2cpp-${{ env.UNITY_IMAGE_VERSION }}"
          for attempt in 1 2 3; do
            docker pull "$IMAGE" && break
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 30s..."
            sleep 30
          done

          CONTAINER_ID="$(docker create "$IMAGE")"
          trap 'docker rm "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT
          mkdir -p .unity-lint-assemblies

          docker cp "$CONTAINER_ID:/opt/unity/Editor/Data/Managed/UnityEngine/." .unity-lint-assemblies/ 2>/dev/null || true
          if docker cp "$CONTAINER_ID:/opt/unity/Editor/Data/Managed/UnityEditor/." .unity-lint-assemblies/ 2>/dev/null; then
            echo "Copied UnityEditor assemblies from Managed/UnityEditor"
          elif docker cp "$CONTAINER_ID:/opt/unity/Editor/Data/Managed/." .unity-lint-assemblies/ 2>/dev/null; then
            echo "Copied Unity managed assemblies from Managed"
          else
            echo "ERROR: Could not locate Unity managed assemblies in $IMAGE"
            exit 1
          fi

          find .unity-lint-assemblies/UnityEngine .unity-lint-assemblies/UnityEditor -maxdepth 1 -name "*.dll" -exec cp {} .unity-lint-assemblies/ \; 2>/dev/null || true

          # Stage uGUI and TextMeshPro package assemblies. These are not in Data/Managed; they are
          # precompiled in the editor image's project-template library cache. Resolving them keeps the
          # lint semantic model complete so IDE0005 does not falsely flag genuinely-used usings.
          docker cp "$CONTAINER_ID:/opt/unity/Editor/Data/Resources/PackageManager/ProjectTemplates/libcache/." /tmp/unity-libcache/ 2>/dev/null || true
          for dll in UnityEngine.UI.dll Unity.TextMeshPro.dll Unity.TextMeshPro.Editor.dll Unity.InputSystem.dll; do
            src="$(find /tmp/unity-libcache -name "$dll" 2>/dev/null | head -n 1)"
            if [ -n "$src" ]; then
              cp "$src" .unity-lint-assemblies/
            fi
          done
          rm -rf /tmp/unity-libcache

          for assembly in UnityEngine.CoreModule.dll UnityEditor.dll UnityEngine.UI.dll Unity.TextMeshPro.dll Unity.InputSystem.dll UnityEngine.ImageConversionModule.dll UnityEngine.UnityWebRequestModule.dll UnityEngine.UnityWebRequestAudioModule.dll; do
            if [ ! -f ".unity-lint-assemblies/$assembly" ]; then
              echo "ERROR: Missing required Unity lint assembly: $assembly"
              exit 1
            fi
          done

          docker rm "$CONTAINER_ID"
          trap - EXIT

      - name: Lint
        run: UnityManagedAssembliesPath="$PWD/.unity-lint-assemblies" bash build.sh lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, resolve-media]
    environment: production
    permissions:
      checks: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout media (git only, no LFS)
        uses: actions/checkout@v4
        with:
          repository: davidadas/rebellion2-media
          ref: ${{ needs.resolve-media.outputs.revision }}
          ssh-key: ${{ secrets.REBELLION2_MEDIA_SSH_KEY }}
          lfs: false
          path: .ci/rebellion2-media

      - name: Pull media LFS from R2
        working-directory: .ci/rebellion2-media
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          HOST="${R2_ENDPOINT#https://}"
          git config lfs.url "https://${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}@rebellion2-lfs-proxy.pages.dev/${HOST}/${R2_BUCKET}"
          git config lfs.concurrenttransfers 3
          git config lfs.transfer.batchSize 20
          for attempt in 1 2 3 4; do
            if git lfs pull --include="Content/**,Models/MainMenu/**" --exclude=""; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              echo "Media LFS download failed after $attempt attempts."
              exit 1
            fi
            delay=$((attempt * 20))
            echo "Media LFS download attempt $attempt failed; retrying in ${delay}s..."
            sleep "$delay"
          done
          if grep -RIl '^version https://git-lfs.github.com/spec/v1$' Content Models/MainMenu; then
            echo "Media checkout still contains Git LFS pointers."
            exit 1
          fi

      - name: Install media
        run: |
          mkdir -p Assets/Content Assets/Art/Models/MainMenu Assets/Resources/UI
          test -f .ci/rebellion2-media/Content/Application/Schemas/game-config.xsd
          rsync -a --delete --exclude=.DS_Store --exclude='*.meta' .ci/rebellion2-media/Content/ Assets/Content/
          rsync -a --delete --exclude=.DS_Store --exclude='*.meta' .ci/rebellion2-media/Models/MainMenu/ Assets/Art/Models/MainMenu/
          cp .ci/rebellion2-media/Content/Application/Common/UI/ui_common_cursor_default_outlined.png Assets/Resources/UI/DefaultCursor.png
          rm -rf .ci

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          dockerCpuLimit: 2
          dockerMemoryLimit: 8g
          customParameters: -executeMethod UIBuilderMenu.BuildAll
          coverageOptions: "generateAdditionalMetrics;generateHtmlReport;assemblyFilters:+GameAssembly"

      - name: Check coverage threshold
        run: |
          python3 - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          LINE_THRESHOLD   = 79.0
          METHOD_THRESHOLD = 87.8

          summary_path = Path("CodeCoverage/Report/Summary.xml")
          if not summary_path.is_file():
              print("FAIL: CodeCoverage/Report/Summary.xml was not generated")
              sys.exit(1)

          root = ET.parse(summary_path).getroot()
          summary = root.find("Summary")

          covered_lines = int(summary.findtext("Coveredlines", 0))
          total_lines   = int(summary.findtext("Totallines", 0))
          line_pct      = float(summary.findtext("Linecoverage", 0))

          covered_methods = int(summary.findtext("Coveredmethods", 0))
          total_methods   = int(summary.findtext("Totalmethods", 0))
          method_pct      = float(summary.findtext("Methodcoverage", 0))

          print(f"Line coverage:   {line_pct:.1f}% ({covered_lines}/{total_lines})")
          print(f"Method coverage: {method_pct:.1f}% ({covered_methods}/{total_methods})")

          failed = False
          if line_pct < LINE_THRESHOLD:
              print(f"FAIL: line coverage {line_pct:.1f}% is below threshold {LINE_THRESHOLD}%")
              failed = True
          if method_pct < METHOD_THRESHOLD:
              print(f"FAIL: method coverage {method_pct:.1f}% is below threshold {METHOD_THRESHOLD}%")
              failed = True

          if failed:
              sys.exit(1)

          print("OK: all coverage thresholds met")
          EOF
