name: Resolve media revision

on:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: true
      expected_base_sha:
        type: string
        default: ''
      expected_head_sha:
        type: string
        default: ''
      branch:
        type: string
        default: ''
    outputs:
      revision:
        value: ${{ jobs.resolve.outputs.revision }}
      sha:
        value: ${{ jobs.resolve.outputs.sha }}

jobs:
  resolve:
    name: Resolve media revision
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
      sha: ${{ steps.resolve.outputs.sha }}

    steps:
      - name: Checkout trusted media resolver
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: Tools/resolve_media_revision.py
          sparse-checkout-cone-mode: false
          path: .ci/workflow-tools

      - name: Checkout tested media pin
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false
          sparse-checkout: .github/media-revision
          sparse-checkout-cone-mode: false
          path: .ci/source-metadata

      - name: Verify tested merge revision
        if: inputs.expected_head_sha != ''
        working-directory: .ci/source-metadata
        env:
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_BASE_SHA" =~ ^[a-f0-9]{40}$ ]] ||
             [[ ! "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Exact base and head revisions are required."
            exit 1
          fi
          parents="$(git show --no-patch --format=%P HEAD)"
          if [[ " $parents " != *" $EXPECTED_BASE_SHA "* ]] ||
             [[ " $parents " != *" $EXPECTED_HEAD_SHA "* ]]; then
            echo "The tested media revision is not the approved pull request merge."
            exit 1
          fi

      - name: Checkout media metadata
        uses: actions/checkout@v4
        with:
          repository: adasgames/rebellion2-media
          ref: main
          ssh-key: ${{ secrets.REBELLION2_MEDIA_SSH_KEY }}
          lfs: false
          path: .ci/rebellion2-media

      - name: Resolve matching media branch
        id: resolve
        env:
          PULL_REQUEST_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          python3 .ci/workflow-tools/Tools/resolve_media_revision.py \
            --source-root .ci/source-metadata \
            --media-checkout .ci/rebellion2-media \
            --branch "$PULL_REQUEST_BRANCH" | tee -a "$GITHUB_OUTPUT"
