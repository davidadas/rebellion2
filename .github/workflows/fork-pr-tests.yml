name: Request fork PR tests

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: fork-test-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  request:
    name: Request reviewed test run
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!Number.isSafeInteger(pr.number) || pr.number <= 0 ||
                !/^[a-f0-9]{40}$/.test(pr.head.sha)) {
              throw new Error('Invalid pull request metadata.');
            }
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'unity-tests.yml',
              ref: context.payload.repository.default_branch,
              inputs: {
                pull_request_number: String(pr.number),
                head_sha: pr.head.sha,
              },
            });
